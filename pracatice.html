<!DOCTYPE html>
<html>
  <head>
    <title>
      SATHI MAHALAKSHMI | PORTFOLIIO
    </title>
  </head>
  <body>
    <nav class="nav-bar">
      <div class="logo">
         Sathi Mahalakshmi
      </div>
      <div class="nav-links">
        <a href="#home"> Home</a>
        <a href="#About"> About</a>
        <a href="#Skills"> Skills</a>
        <a href="#Projects"> Projects</a>
        <a href="#Contact"> Contact</a>
      </div>

    </nav>
    <section class="home">
      <div class="home-contents">
        <p class="intro"
        > hello i'm</p>
        <h1>mahalakshmi</h1>
      </div>
      <div class="home-buttons">
        <button>Download Resume</button>

      </div>
      <div class="image">
        <img src="profile.jpeg" alt="Maha">
      </div>

    </section>
  
    <section class="details-form">
      <form>
      <p>Personal Details: </p>
      <br>
      <label for="username">Name: </label>
      <input type="text" id="username" placeholder="Enter your name" required>
      <br>
      <label for="email">Email: </label>
      <input type="email" id="email" placeholder="Enter your email" required>
      <br>
      <label for="password">Password: </label>
      <input type="password" id="password" placeholder="Enter your password" required>
      <br>
      <label for="age">Age: </label>
      <input type="number" id="age" placeholder="Enter your age" required>
      <br>
      <label for="date">Date of Birth: </label>
      <input type="date" id="date" placeholder="Enter your date of birth" required>
      <br>
      <p>Gender: </p>
      <input type="radio" id="male" name="gender" value="male">
      <label for="male">Male</label>
      <input type="radio" id="female"  name="gender" value="female">
      <label for="female">Female</label>
      <input type="radio" id="other" name="gender" value="other">
      <label for="other">Other</label>

      <br>
      <p>Skills: </p>
      <input type="checkbox" id="html" value="HTML">
      <label for="html">HTML</label>
      <input type="checkbox" id="css" value="CSS">
      <label for="css">CSS</label>
      <input type="checkbox" id="js" value="JavaScript">
      <label for="js">JavaScript</label>
      <br>
      <label for="branch">Branch: </label>
      <select>
        <option value="cse">CSE</option>
        <option value="ece">ECE</option>
      </select>
      <br>
      <br>
      <label for="message">Message: </label>
      <textarea id="message" placeholder="Write your message..." required></textarea>
      <br>
      <br>
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>

    </form>
    </section>
  </body>
</html>
